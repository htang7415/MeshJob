name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium --no-shell
      - run: npm run build
      - run: npm run test:e2e
        env:
          MESHJOB_TEST_ROOT: ${{ runner.temp }}/meshjob
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: meshjob-browser-evidence
          path: |
            ${{ runner.temp }}/meshjob/run-*/browser-results.json
            ${{ runner.temp }}/meshjob/run-*/*.png
